<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Vertex Storefront</title>
    <script>
      (function () {
        var host = (
          window.location && window.location.hostname ? window.location.hostname : ''
        ).toLowerCase();
        if (!host) return;

        var first = host.split('.')[0] || '';
        if (!first || first === 'localhost') return;

        var inferred = first
          .split('-')
          .filter(Boolean)
          .map(function (part) {
            return part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join(' ');

        if (inferred) {
          document.title = inferred;
        }
      })();
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Descubre nuestra selección de productos con la mejor calidad, ofertas exclusivas y envíos rápidos. Compra online en Vertex Storefront."
    />
    <link rel="canonical" href="https://vertex-storefront.web.app/" />

    <!-- Open Graph / WhatsApp Preview Fallback Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vertex Storefront" />
    <meta property="og:title" content="Vertex Storefront - Tienda Online Oficial" />
    <meta
      property="og:description"
      content="Descubre nuestra selección de productos con la mejor calidad, ofertas exclusivas y envíos rápidos. Compra online en Vertex Storefront."
    />
    <meta property="og:url" content="https://vertex-storefront.web.app/" />
    <meta
      property="og:image"
      content="https://vertex-storefront.web.app/assets/images/og-preview.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://vertex-storefront.web.app/assets/images/og-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vertex Storefront" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vertex Storefront - Tienda Online Oficial" />
    <meta
      name="twitter:description"
      content="Descubre nuestra selección de productos con la mejor calidad, ofertas exclusivas y envíos rápidos. Compra online en Vertex Storefront."
    />
    <meta
      name="twitter:image"
      content="https://vertex-storefront.web.app/assets/images/og-preview.png"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

</html>
