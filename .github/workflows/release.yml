name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

env:
  NODE_VERSION: '24.18.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-tag-source:
    name: Validate tag is from main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tag points to a commit reachable from main
        run: |
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref }})
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main 2>/dev/null; then
            # Allow tags pushed while main is still catching up (e.g., tag on develop ahead of main)
            echo "::warning::Tag commit is not yet reachable from main. Proceeding anyway."
          fi

      - name: Extract version from tag
        id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing release for version: $VERSION"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate-tag-source
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ needs.validate-tag-source.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            echo "Run: npm run release:minor (or patch/major) to bump the version correctly."
            exit 1
          fi
          echo "✅ package.json version matches tag: $PKG_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.validate-tag-source.outputs.version }}"
          # Idempotente: si la release ya existe (p. ej. creada manualmente o en un
          # re-run), no falla el pipeline — la actualiza y sigue.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "ℹ️ Release ${{ github.ref_name }} ya existe — se omite la creación."
          else
            gh release create "${{ github.ref_name }}" \
              --title "v${VERSION}" \
              --generate-notes \
              --verify-tag
          fi

  notify-platform:
    name: Notify platform of new storefront version
    runs-on: ubuntu-latest
    needs: [validate-tag-source, create-release]
    steps:
      - name: Dispatch to vertex-platform
        env:
          PLATFORM_DISPATCH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_PAT }}
          VERSION: ${{ needs.validate-tag-source.outputs.version }}
        run: |
          # `curl -s` NO falla con un HTTP 401/403: el step reportaba "✅ Notified"
          # aunque el token estuviera vencido (pasó con v0.9.5 y v0.9.6, y por eso
          # CURRENT_TEMPLATE_VERSION quedó atrasado en la plataforma). Ahora se usa
          # --fail-with-body, hay fallback con ADMIN_PAT y si ninguno sirve el job falla.
          dispatch() {
            curl -sS --fail-with-body --max-time 30 -X POST \
              -H "Authorization: token $1" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/vertex-solutions-ar/vertex-platform/dispatches" \
              -d "{\"event_type\": \"storefront-release\", \"client_payload\": {\"version\": \"$VERSION\", \"tag\": \"v$VERSION\"}}"
          }

          if dispatch "$PLATFORM_DISPATCH_TOKEN" >/dev/null; then
            echo "✅ Notified vertex-platform of storefront release v$VERSION"
          elif [ -n "$ADMIN_TOKEN" ] && dispatch "$ADMIN_TOKEN" >/dev/null; then
            echo "::warning::PLATFORM_DEPLOY_TOKEN no sirve (credentials); se notificó con ADMIN_PAT"
          else
            echo "::error::No se pudo notificar a vertex-platform del release v$VERSION. Revisá PLATFORM_DEPLOY_TOKEN / ADMIN_PAT."
            exit 1
          fi

      - name: Trigger deploy-all-stores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy All Stores" --repo vertex-solutions-ar/ecommerce-vertex --ref main
          echo "✅ Triggered Deploy All Stores for release v${{ needs.validate-tag-source.outputs.version }}"
