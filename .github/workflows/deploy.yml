name: Deploy

on:
  push:
    branches: [develop, main]
  repository_dispatch:
    types: [provision-store, update-store-version]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options: [production, development]

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event.client_payload.store_id || github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run frontend tests
        run: npm run test:ci

      - name: Install backend dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: functions

      - name: Run backend tests
        run: npm run test
        working-directory: functions

  build-dev:
    name: Build (Development)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.environment == 'development')
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          cat > src/firebase-config.json << EOF
          {
            "apiKey": "$FIREBASE_API_KEY",
            "authDomain": "$FIREBASE_AUTH_DOMAIN",
            "projectId": "$FIREBASE_PROJECT_ID",
            "storageBucket": "$FIREBASE_STORAGE_BUCKET",
            "messagingSenderId": "$FIREBASE_MESSAGING_SENDER_ID",
            "appId": "$FIREBASE_APP_ID",
            "measurementId": "$FIREBASE_MEASUREMENT_ID"
          }
          EOF

      - name: Build development (template mode — tenantId resolved at runtime)
        run: npm run build:dev-template

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser
          retention-days: 1

  build-prod:
    name: Build (Production)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'production')
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          cat > src/firebase-config.json << EOF
          {
            "apiKey": "$FIREBASE_API_KEY",
            "authDomain": "$FIREBASE_AUTH_DOMAIN",
            "projectId": "$FIREBASE_PROJECT_ID",
            "storageBucket": "$FIREBASE_STORAGE_BUCKET",
            "messagingSenderId": "$FIREBASE_MESSAGING_SENDER_ID",
            "appId": "$FIREBASE_APP_ID",
            "measurementId": "$FIREBASE_MEASUREMENT_ID"
          }
          EOF

      - name: Build production
        run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-prod-${{ github.sha }}
          path: dist/ecommerce-vertex/browser
          retention-days: 1

  functions-build:
    name: Functions Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: functions

      - run: npm run build
        working-directory: functions

  deploy-dev:
    name: '→ Development'
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, build-dev, functions-build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.environment == 'development')
    environment:
      name: development
      url: https://ecommerce-vertex-dev.web.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: functions

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - name: Generate functions environment file
        env:
          MERCADOPAGO_WEBHOOK_URL: ${{ secrets.MERCADOPAGO_WEBHOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MERCADOPAGO_ACCESSTOKEN: ${{ secrets.MERCADOPAGO_ACCESSTOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          cat > functions/.env.ecommerce-vertex-dev << EOF
          MERCADOPAGO_WEBHOOK_URL=${MERCADOPAGO_WEBHOOK_URL}
          SITE_URL=${SITE_URL}
          MERCADOPAGO_ACCESSTOKEN=${MERCADOPAGO_ACCESSTOKEN}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT:-587}
          SMTP_USER=${SMTP_USER}
          SMTP_PASS=${SMTP_PASS}
          FROM_EMAIL=${FROM_EMAIL}
          NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
          EOF

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Hosting (Development)
        run: npx firebase-tools deploy --project development --only hosting:ecommerce-vertex --non-interactive

      - name: Deploy Functions (Development)
        run: bash scripts/deploy-functions.sh development

      - name: Post-Deploy Health Check (Development)
        run: |
          echo "Verificando propagación activa de versión en Storefront DEV..."
          EXPECTED_SHA="${{ github.sha }}"
          SHORT_SHA="${EXPECTED_SHA:0:7}"
          SUCCESS=0

          for i in $(seq 1 10); do
            echo "Intento $i de 10: Consultando https://ecommerce-vertex-dev.web.app/assets/version.json?nocache=${EXPECTED_SHA} ..."
            VERSION_RESP=$(curl -s "https://ecommerce-vertex-dev.web.app/assets/version.json?nocache=${EXPECTED_SHA}" || true)
            DEPLOYED_SHA=$(echo "$VERSION_RESP" | jq -r '.commitSha // empty' 2>/dev/null || echo "")

            if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ] || [ "$DEPLOYED_SHA" = "$SHORT_SHA" ]; then
              echo "✅ Verificación exitosa en Storefront DEV: commitSha coincide ($DEPLOYED_SHA)"
              SUCCESS=1
              break
            else
              echo "⏳ Commit SHA detectado: '$DEPLOYED_SHA' (esperado: '$SHORT_SHA' o '$EXPECTED_SHA'). Reintentando en 5s..."
              sleep 5
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ ERROR: Timeout en propagación de CDN para Storefront DEV tras 10 intentos (50s)."
            echo "Última respuesta recibida:"
            echo "$VERSION_RESP"
            exit 1
          fi

  deploy-prod:
    name: '→ Production'
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, build-prod, functions-build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'production')
    environment:
      name: production
      url: https://ecommerce-vertex.web.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: functions

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-prod-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - name: Generate functions environment file
        env:
          MERCADOPAGO_WEBHOOK_URL: ${{ secrets.MERCADOPAGO_WEBHOOK_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MERCADOPAGO_ACCESSTOKEN: ${{ secrets.MERCADOPAGO_ACCESSTOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          cat > functions/.env.ecommerce-vertex << EOF
          MERCADOPAGO_WEBHOOK_URL=${MERCADOPAGO_WEBHOOK_URL}
          SITE_URL=${SITE_URL}
          MERCADOPAGO_ACCESSTOKEN=${MERCADOPAGO_ACCESSTOKEN}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT:-587}
          SMTP_USER=${SMTP_USER}
          SMTP_PASS=${SMTP_PASS}
          FROM_EMAIL=${FROM_EMAIL}
          NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
          EOF

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Hosting (Production)
        run: npx firebase-tools deploy --project production --only hosting:ecommerce-vertex --non-interactive

      - name: Deploy Functions (Production)
        run: bash scripts/deploy-functions.sh production

      - name: Post-Deploy Health Check (Production)
        run: |
          echo "Verificando propagación activa de versión en Storefront PROD..."
          EXPECTED_SHA="${{ github.sha }}"
          SHORT_SHA="${EXPECTED_SHA:0:7}"
          SUCCESS=0

          for i in $(seq 1 10); do
            echo "Intento $i de 10: Consultando https://ecommerce-vertex.web.app/assets/version.json?nocache=${EXPECTED_SHA} ..."
            VERSION_RESP=$(curl -s "https://ecommerce-vertex.web.app/assets/version.json?nocache=${EXPECTED_SHA}" || true)
            DEPLOYED_SHA=$(echo "$VERSION_RESP" | jq -r '.commitSha // empty' 2>/dev/null || echo "")

            if [ "$DEPLOYED_SHA" = "$EXPECTED_SHA" ] || [ "$DEPLOYED_SHA" = "$SHORT_SHA" ]; then
              echo "✅ Verificación exitosa en Storefront PROD: commitSha coincide ($DEPLOYED_SHA)"
              SUCCESS=1
              break
            else
              echo "⏳ Commit SHA detectado: '$DEPLOYED_SHA' (esperado: '$SHORT_SHA' o '$EXPECTED_SHA'). Reintentando en 5s..."
              sleep 5
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ ERROR: Timeout en propagación de CDN para Storefront PROD tras 10 intentos (50s)."
            echo "Última respuesta recibida:"
            echo "$VERSION_RESP"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes || true

  provision-store:
    name: '→ Provision Store (${{ github.event.client_payload.project_id }}) [${{ github.event.client_payload.site_id || github.event.client_payload.store_id }}]'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site-${{ github.event.client_payload.project_id }}
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC para autenticación automática con vertex-platform (sin secrets manuales)
      contents: read
    if: github.event_name == 'repository_dispatch' && (github.event.action == 'provision-store' || github.event.action == 'update-store-version')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.ref || (github.event.client_payload.environment == 'development' && 'develop' || 'main')) || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate store environment file
        run: |
          python3 << 'PYEOF'
          import os, json
          import json as _json
          _event = _json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          _payload = _event["client_payload"]
          config = _json.loads(_payload["firebase_config"])
          store_id = _payload.get("store_id", "store")
          tenant_id = (_payload.get("tenant_id", "") or "").strip() or store_id
          env = _payload.get("environment", "production")
          master_functions_project = "ecommerce-vertex-dev" if env == "development" else "ecommerce-vertex"
          content = """export const environment = {{
            production: true,
            useEmulators: false,
            tenantId: "{tenantId}",
            firebaseConfig: {{
              apiKey: "{apiKey}",
              authDomain: "{authDomain}",
              projectId: "{projectId}",
              storageBucket: "{storageBucket}",
              messagingSenderId: "{messagingSenderId}",
              appId: "{appId}"
            }},
            mercadoPago: {{
              publicKey: ""
            }},
            api: {{
              cloudFunctionsUrl: "https://us-central1-{masterProject}.cloudfunctions.net"
            }},
            features: {{
              seedDataEnabled: false,
              debugLogging: false
            }}
          }};""".format(
            tenantId=tenant_id,
            apiKey=config["apiKey"],
            authDomain=config["authDomain"],
            projectId=config["projectId"],
            storageBucket=config["storageBucket"],
            messagingSenderId=config["messagingSenderId"],
            appId=config["appId"],
            masterProject=master_functions_project
          )
          with open("src/environments/environment.prod.ts", "w") as f:
            f.write(content)

          # Write firebase-config.json so Angular fetches the correct shard
          # config at runtime instead of the hardcoded fallback in environment.ts.
          # This is what fixes "store deployed but empty" — main.ts fetches this
          # file first and uses it to initialise the Firebase SDK.
          with open("src/firebase-config.json", "w") as f:
            json.dump(config, f, indent=2)
          PYEOF

      - name: Build production
        run: npm run build
        env:
          DEPLOY_NUMBER: ${{ github.event.client_payload.deploy_number || '1' }}
          REDEPLOY_NUMBER: ${{ github.event.client_payload.redeploy_number || '0' }}
          IS_REDEPLOY: ${{ github.event.client_payload.is_redeploy || 'false' }}
          DEPLOY_TIMESTAMP: ${{ github.event.client_payload.deploy_timestamp || '' }}

      - name: Write minimal firebase.json for store deployment
        run: |
          python3 << 'PYEOF'
          import os, json
          site_id = os.environ.get("SITE_ID", "").strip()
          payload = {
            "hosting": {
              "public": "dist/ecommerce-vertex/browser",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }],
              "headers": [
                {
                  "source": "**/*.@(js|css|woff|woff2|ttf|eot|png|jpg|jpeg|webp|svg|ico)",
                  "headers": [{ "key": "Cache-Control", "value": "public, max-age=31536000, immutable" }]
                },
                {
                  "source": "**",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" },
                    { "key": "Cross-Origin-Opener-Policy", "value": "same-origin-allow-popups" }
                  ]
                }
              ]
            }
          }
          if site_id and site_id != "default":
              payload["hosting"]["site"] = site_id
          with open("firebase.json", "w") as f:
              json.dump(payload, f, indent=2)
          PYEOF
        env:
          SITE_ID: ${{ github.event.client_payload.site_id }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLATFORM || secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Log Service Account Identity
        run: |
          python3 -c 'import json, os; p=os.environ.get("GOOGLE_APPLICATION_CREDENTIALS"); print("Active Deploy Service Account:", json.load(open(p)).get("client_email")) if p and os.path.exists(p) else print("No GAC file found")'

      - name: Deploy to store Firebase project
        run: |
          SITE_ID="${{ github.event.client_payload.site_id }}"
          PROJECT_ID="${{ github.event.client_payload.project_id }}"
          if [ -n "$SITE_ID" ] && [ "$SITE_ID" != "default" ]; then
            echo "Ensuring site $SITE_ID exists on project $PROJECT_ID..."
            npx firebase-tools hosting:sites:create "$SITE_ID" --project "$PROJECT_ID" --non-interactive || true
            echo "Deploying hosting to site $SITE_ID on Firebase project $PROJECT_ID..."
          else
            echo "Deploying default hosting to Firebase project $PROJECT_ID..."
          fi
          npx firebase-tools deploy --project "$PROJECT_ID" --only hosting --non-interactive

      - name: Notify platform of deployment completion
        if: always() && github.event.client_payload.platform_project_id != ''
        run: |
          # AUTOMATIZADO: autenticación OIDC de GitHub Actions (sin secrets manuales).
          # El platform valida el id_token (issuer, audience 'vertex-platform', repository, firma).
          ID_TOKEN=""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            ID_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vertex-platform" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          fi
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=%B | tr -d '"' | tr -d '\n' | tr -d '\r' | cut -c1-100)
          # El ref del token OIDC es el del workflow (main), no el del template (client_payload.ref).
          REF_NAME="${{ github.ref }}"
          VERSION="${{ github.event.client_payload.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          # update-store-version finaliza vía completeVersionUpdate (no completeStoreDeployment)
          ENDPOINT="completeStoreDeployment"
          if [ "${{ github.event.action }}" == "update-store-version" ]; then
            ENDPOINT="completeVersionUpdate"
            # Reportar progreso real al panel antes de finalizar (deploy ya terminó).
            curl -s -X POST \
              "https://us-central1-${{ github.event.client_payload.platform_project_id }}.cloudfunctions.net/reportVersionUpdateProgress" \
              -H "Content-Type: application/json" \
              -d "{\"data\": {\"storeId\": \"${{ github.event.client_payload.store_id }}\", \"deployToken\": \"${{ github.event.client_payload.deploy_token }}\", \"step\": \"Finalizando deploy\", \"pct\": 95}}"
          fi
          curl -s -X POST \
            "https://us-central1-${{ github.event.client_payload.platform_project_id }}.cloudfunctions.net/$ENDPOINT" \
            -H "Content-Type: application/json" \
            -d "{\"data\": {\"storeId\": \"${{ github.event.client_payload.store_id }}\", \"success\": ${{ job.status == 'success' }}, \"idToken\": \"$ID_TOKEN\", \"deployToken\": \"${{ github.event.client_payload.deploy_token }}\", \"commitSha\": \"$COMMIT_SHA\", \"commitMessage\": \"$COMMIT_MSG\", \"ref\": \"$REF_NAME\", \"version\": \"$VERSION\"}}"
