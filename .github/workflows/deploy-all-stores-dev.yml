name: Deploy All Stores (Development)

on:
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLATFORM_FUNCTIONS_URL: 'https://us-central1-vertex-platform-dev.cloudfunctions.net'

jobs:
  # ── 1. Build once ──────────────────────────────────────────────────────────
  build:
    name: Build template (dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]') || vars.AUTO_DEPLOY_ALL == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint & type check
        run: npm run lint && npm run typecheck

      - name: Build (development — template mode)
        run: |
          echo '{}' > src/firebase-config.json
          npm run build:dev-template

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser
          retention-days: 1

  # ── 2. Fetch active dev stores ────────────────────────────────────────────
  get-stores:
    name: Get active dev stores
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC para autenticación automática con vertex-platform (sin secrets manuales)
      contents: read
    outputs:
      auto_canary: ${{ steps.parse.outputs.auto_canary }}
      auto_rest: ${{ steps.parse.outputs.auto_rest }}
      shards: ${{ steps.parse.outputs.shards }}
      has_stores: ${{ steps.parse.outputs.has_stores }}
    steps:
      - name: Fetch OIDC token
        id: oidc
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('vertex-platform');
            core.setOutput('id_token', token);

      - name: Fetch from platform dev API
        id: fetch
        run: |
          # AUTOMATIZADO: id_token OIDC de GitHub Actions (validado por el platform).
          ID_TOKEN="${{ steps.oidc.outputs.id_token }}"
          RESPONSE=$(curl -s -X POST \
            "${{ env.PLATFORM_FUNCTIONS_URL }}/getActiveStores" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"idToken\":\"$ID_TOKEN\"}}")
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"

      - name: Parse stores into canary + rest
        id: parse
        env:
          RESPONSE: ${{ steps.fetch.outputs.response }}
        run: |
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "API Error: $ERROR" >&2
            exit 1
          fi

          STORES=$(echo "$RESPONSE" | jq -c '[.result.stores[]?]')
          COUNT=$(echo "$STORES" | jq 'length')

          if [ "$COUNT" -eq "0" ]; then
            echo "has_stores=false" >> "$GITHUB_OUTPUT"
            echo "auto=[]" >> "$GITHUB_OUTPUT"
            echo "shards=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_stores=true" >> "$GITHUB_OUTPUT"
            # Lógica de negocio: SOLO las tiendas marcadas como "latest" (autoUpdate=true)
            # se redeployan (hosting) al subir código nuevo. Las tiendas estables/pinned
            # conservan su versión hasta que se actualicen manualmente desde el panel.
            AUTO=$(echo "$STORES" | jq -c '[.[] | select(.autoUpdate == true)]')
            # La infraestructura del shard (rules, índices, functions) SIEMPRE debe estar
            # al día en TODOS los shards con tiendas activas (es compartida entre tiendas).
            SHARDS=$(echo "$STORES" | jq -c '[.[].projectId] | unique | map({projectId: .})')
            echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
            AUTO_COUNT=$(echo "$AUTO" | jq 'length')
            if [ "$AUTO_COUNT" -gt "0" ]; then
              echo "auto_canary=$(echo "$AUTO" | jq -c '[.[0]]')" >> "$GITHUB_OUTPUT"
              echo "auto_rest=$(echo "$AUTO" | jq -c '.[1:]')" >> "$GITHUB_OUTPUT"
            else
              echo "auto_canary=[]" >> "$GITHUB_OUTPUT"
              echo "auto_rest=[]" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ── 3. Deploy canary first ────────────────────────────────────────────────
  deploy-canary:
    name: '🐤 Canary dev → ${{ matrix.store.storeName }}'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site-${{ matrix.store.projectId }}
      cancel-in-progress: false
    needs: [build, get-stores]
    if: needs.get-stores.outputs.auto_canary != '[]' && needs.get-stores.outputs.auto_canary != ''
    environment: development
    strategy:
      matrix:
        store: ${{ fromJson(needs.get-stores.outputs.auto_canary) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - name: Inject firebase config
        env:
          FIREBASE_CONFIG_JSON: ${{ matrix.store.firebaseConfig }}
        run: printf '%s' "$FIREBASE_CONFIG_JSON" > dist/ecommerce-vertex/browser/firebase-config.json

      - name: Write minimal firebase.json for store deployment
        run: |
          python3 << 'PYEOF'
          import os, json
          site_id = os.environ.get("SITE_ID", "").strip()
          payload = {
            "hosting": {
              "public": "dist/ecommerce-vertex/browser",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }],
              "headers": [
                {
                  "source": "**/*.@(js|css|woff|woff2|ttf|eot|png|jpg|jpeg|webp|svg|ico)",
                  "headers": [{ "key": "Cache-Control", "value": "public, max-age=31536000, immutable" }]
                },
                {
                  "source": "**",
                  "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }]
                }
              ]
            },
            "storage": {
              "rules": "storage.rules"
            },
            "firestore": {
              "rules": "firestore.rules",
              "indexes": "firestore.indexes.json"
            }
          }
          if site_id and site_id != "default":
              payload["hosting"]["site"] = site_id
          with open("firebase.json", "w") as f:
              json.dump(payload, f, indent=2)
          PYEOF
        env:
          SITE_ID: ${{ matrix.store.siteId }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy
        run: |
          npx --yes firebase-tools deploy \
            --project ${{ matrix.store.projectId }} \
            --only hosting \
            --non-interactive --force

      - name: Health check (30s)
        run: |
          sleep 30
          URL="https://${{ matrix.store.siteId }}.web.app"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: HTTP $STATUS for $URL"
            exit 1
          fi
          echo "✅ Health check passed: HTTP $STATUS for $URL"

  # ── 4. Deploy rest in parallel (only if canary passed) ───────────────────
  deploy-rest:
    name: '→ dev ${{ matrix.store.storeName }}'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site-${{ matrix.store.projectId }}
      cancel-in-progress: false
    needs: [build, get-stores, deploy-canary]
    if: needs.get-stores.outputs.auto_rest != '[]' && needs.get-stores.outputs.auto_rest != ''
    environment: development
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJson(needs.get-stores.outputs.auto_rest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-dev-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - name: Inject firebase config
        env:
          FIREBASE_CONFIG_JSON: ${{ matrix.store.firebaseConfig }}
        run: printf '%s' "$FIREBASE_CONFIG_JSON" > dist/ecommerce-vertex/browser/firebase-config.json

      - name: Write minimal firebase.json for store deployment
        run: |
          python3 << 'PYEOF'
          import os, json
          site_id = os.environ.get("SITE_ID", "").strip()
          payload = {
            "hosting": {
              "public": "dist/ecommerce-vertex/browser",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }],
              "headers": [
                {
                  "source": "**/*.@(js|css|woff|woff2|ttf|eot|png|jpg|jpeg|webp|svg|ico)",
                  "headers": [{ "key": "Cache-Control", "value": "public, max-age=31536000, immutable" }]
                },
                {
                  "source": "**",
                  "headers": [{ "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }]
                }
              ]
            },
            "storage": {
              "rules": "storage.rules"
            }
          }
          if site_id and site_id != "default":
              payload["hosting"]["site"] = site_id
          with open("firebase.json", "w") as f:
              json.dump(payload, f, indent=2)
          PYEOF
        env:
          SITE_ID: ${{ matrix.store.siteId }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy
        run: |
          npx --yes firebase-tools deploy \
            --project ${{ matrix.store.projectId }} \
            --only hosting \
            --non-interactive --force

      - name: Health check (30s)
        run: |
          sleep 30
          URL="https://${{ matrix.store.siteId }}.web.app"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: HTTP $STATUS for $URL"
            exit 1
          fi
          echo "✅ Health check passed: HTTP $STATUS for $URL"

  # ── 5. Shard infrastructure (rules + indexes + functions) — SIEMPRE al día ──
  # Las rules/índices/functions son COMPARTIDAS entre las tiendas de un shard, así que
  # se despliegan en TODOS los shards con tiendas activas (independiente de autoUpdate).
  deploy-infra:
    name: '⚙️ Infra shard → ${{ matrix.shard.projectId }}'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site-${{ matrix.shard.projectId }}
      cancel-in-progress: false
    needs: [get-stores]
    if: needs.get-stores.outputs.shards != '[]' && needs.get-stores.outputs.shards != ''
    environment: development
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.get-stores.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - name: Write minimal firebase.json for shard infra
        run: |
          python3 << 'PYEOF'
          import json
          payload = {
            "storage": { "rules": "storage.rules" },
            "firestore": { "rules": "firestore.rules", "indexes": "firestore.indexes.json" },
            "functions": { "source": "functions", "runtime": "nodejs22" }
          }
          with open("firebase.json", "w") as f:
              json.dump(payload, f, indent=2)
          PYEOF

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Ensure Firestore database exists
        run: |
          if ! gcloud firestore databases list --project ${{ matrix.shard.projectId }} 2>/dev/null | grep -q "(default)"; then
            echo "→ Creating Firestore database (default) for ${{ matrix.shard.projectId }}"
            gcloud firestore databases create --project ${{ matrix.shard.projectId }} \
              --location=us-central1 --type=firestore-native 2>/dev/null || true
            sleep 10
          fi

      - name: Clean orphaned functions (type conflicts)
        run: |
          cd functions
          REMOTE="$(npx --yes firebase-tools functions:list --project ${{ matrix.shard.projectId }} --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(chr(10).join((f['name'] if isinstance(f,dict) else str(f)) for f in d))" 2>/dev/null)"
          for fn in $REMOTE; do
            if ! grep -rqE "export const ${fn}\b|exports\.${fn}\b" src/ 2>/dev/null; then
              echo "→ Deleting orphaned function: ${fn}"
              npx --yes firebase-tools functions:delete "${fn}" --project ${{ matrix.shard.projectId }} --force 2>/dev/null || true
            fi
          done

      - name: Deploy shard infra (firestore + storage + functions)
        run: |
          npx --yes firebase-tools deploy \
            --project ${{ matrix.shard.projectId }} \
            --only firestore,storage,functions \
            --non-interactive --force

      - name: Reconcile composite indexes (idempotent)
        env:
          PROJECT_ID: ${{ matrix.shard.projectId }}
        run: python3 scripts/reconcile-indexes.py
