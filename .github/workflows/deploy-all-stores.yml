name: Deploy All Stores

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLATFORM_FUNCTIONS_URL: 'https://us-central1-vertex-platform-app.cloudfunctions.net'

jobs:
  # ── 1. Build once ──────────────────────────────────────────────────────────
  build:
    name: Build template
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint & type check
        run: npm run lint && npm run typecheck

      - name: Extract version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building template version: $VERSION"

      - name: Build
        run: |
          echo '{}' > src/firebase-config.json
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/ecommerce-vertex/browser
          retention-days: 1

  # ── 2. Fetch active stores ─────────────────────────────────────────────────
  get-stores:
    name: Get active stores
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC para autenticación automática con la plataforma
      contents: read
    outputs:
      canary: ${{ steps.parse.outputs.canary }}
      rest: ${{ steps.parse.outputs.rest }}
      has_stores: ${{ steps.parse.outputs.has_stores }}
    steps:
      - name: Fetch OIDC token
        id: oidc
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('vertex-platform');
            core.setOutput('id_token', token);

      - name: Fetch from platform API
        id: fetch
        run: |
          # AUTOMATIZADO: id_token OIDC de GitHub Actions (validado por la plataforma)
          ID_TOKEN="${{ steps.oidc.outputs.id_token }}"
          RESPONSE=$(curl -s -X POST \
            "${{ env.PLATFORM_FUNCTIONS_URL }}/getActiveStores" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"idToken\":\"$ID_TOKEN\"}}")
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"

      - name: Parse stores into canary + rest
        id: parse
        env:
          RESPONSE: ${{ steps.fetch.outputs.response }}
        run: |
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "API Error: $ERROR" >&2
            exit 1
          fi

          STORES=$(echo "$RESPONSE" | jq -c '[.result.stores[]? | select(.autoUpdate == true)]')
          COUNT=$(echo "$STORES" | jq 'length')

          if [ "$COUNT" -eq "0" ]; then
            echo "has_stores=false" >> "$GITHUB_OUTPUT"
            echo "canary=[]" >> "$GITHUB_OUTPUT"
            echo "rest=[]" >> "$GITHUB_OUTPUT"
          else
            echo "has_stores=true" >> "$GITHUB_OUTPUT"
            # First store is canary, rest deploy in parallel
            CANARY=$(echo "$STORES" | jq -c '[.[0]]')
            REST=$(echo "$STORES" | jq -c '.[1:]')
            echo "canary=$CANARY" >> "$GITHUB_OUTPUT"
            echo "rest=$REST" >> "$GITHUB_OUTPUT"
          fi

  # ── 3. Deploy canary first ─────────────────────────────────────────────────
  deploy-canary:
    name: '🐤 Canary → ${{ matrix.store.storeName }}'
    runs-on: ubuntu-latest
    needs: [build, get-stores]
    permissions:
      id-token: write
      contents: read
    if: needs.get-stores.outputs.canary != '[]' && needs.get-stores.outputs.canary != ''
    strategy:
      matrix:
        store: ${{ fromJson(needs.get-stores.outputs.canary) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - name: Inject firebase config
        env:
          FIREBASE_CONFIG_JSON: ${{ matrix.store.firebaseConfig }}
        run: printf '%s' "$FIREBASE_CONFIG_JSON" > dist/ecommerce-vertex/browser/firebase-config.json

      - name: Write minimal firebase.json for store deployment
        run: |
          python3 << 'PYEOF'
          import os, json
          site_id = os.environ.get("SITE_ID", "").strip()
          payload = {
            "hosting": {
              "public": "dist/ecommerce-vertex/browser",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }]
            },
            "storage": {
              "rules": "storage.rules"
            }
          }
          if site_id and site_id != "default":
              payload["hosting"]["site"] = site_id
          with open("firebase.json", "w") as f:
              json.dump(payload, f, indent=2)
          PYEOF
        env:
          SITE_ID: ${{ matrix.store.siteId }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'

      - name: Deploy
        id: deploy
        run: |
          npx --yes firebase-tools deploy \
            --project ${{ matrix.store.projectId }} \
            --only hosting,firestore,storage \
            --non-interactive

      - name: Health check (30s)
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ matrix.store.siteId }}.web.app")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "✅ Health check passed: HTTP $STATUS"

      - name: Fetch OIDC token for completion
        id: oidc
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('vertex-platform');
            core.setOutput('id_token', token);

      - name: Notify platform of version update completion
        if: always() && steps.deploy.outcome == 'success'
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.id_token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          curl -s -X POST \
            "${{ env.PLATFORM_FUNCTIONS_URL }}/completeVersionUpdate" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"storeId\":\"${{ matrix.store.storeId }}\",\"version\":\"$VERSION\",\"success\":true,\"commitSha\":\"${{ github.sha }}\",\"idToken\":\"$ID_TOKEN\",\"sourceKind\":\"release\",\"sourceRef\":\"v$VERSION\",\"sourceSha\":\"${{ github.sha }}\"}}"

  # ── 4. Deploy rest in parallel (only if canary passed) ────────────────────
  deploy-rest:
    name: '→ ${{ matrix.store.storeName }}'
    runs-on: ubuntu-latest
    needs: [build, get-stores, deploy-canary]
    permissions:
      id-token: write
      contents: read
    if: needs.get-stores.outputs.rest != '[]' && needs.get-stores.outputs.rest != ''
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJson(needs.get-stores.outputs.rest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/ecommerce-vertex/browser

      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: functions

      - run: npm run build
        working-directory: functions

      - name: Inject firebase config
        env:
          FIREBASE_CONFIG_JSON: ${{ matrix.store.firebaseConfig }}
        run: printf '%s' "$FIREBASE_CONFIG_JSON" > dist/ecommerce-vertex/browser/firebase-config.json

      - name: Write minimal firebase.json for store deployment
        run: |
          python3 << 'PYEOF'
          import os, json
          site_id = os.environ.get("SITE_ID", "").strip()
          payload = {
            "hosting": {
              "public": "dist/ecommerce-vertex/browser",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "rewrites": [{ "source": "**", "destination": "/index.html" }]
            },
            "storage": {
              "rules": "storage.rules"
            },
            "functions": {
              "source": "functions",
              "runtime": "nodejs22"
            }
          }
          if site_id and site_id != "default":
              payload["hosting"]["site"] = site_id
          with open("firebase.json", "w") as f:
              json.dump(payload, f, indent=2)
          PYEOF
        env:
          SITE_ID: ${{ matrix.store.siteId }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}'

      - name: Deploy
        id: deploy
        run: |
          npx --yes firebase-tools deploy \
            --project ${{ matrix.store.projectId }} \
            --only hosting,firestore,storage,functions \
            --non-interactive

      - name: Fetch OIDC token for completion
        id: oidc
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('vertex-platform');
            core.setOutput('id_token', token);

      - name: Notify platform of version update completion
        if: always() && steps.deploy.outcome == 'success'
        env:
          ID_TOKEN: ${{ steps.oidc.outputs.id_token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          curl -s -X POST \
            "${{ env.PLATFORM_FUNCTIONS_URL }}/completeVersionUpdate" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"storeId\":\"${{ matrix.store.storeId }}\",\"version\":\"$VERSION\",\"success\":true,\"commitSha\":\"${{ github.sha }}\",\"idToken\":\"$ID_TOKEN\",\"sourceKind\":\"release\",\"sourceRef\":\"v$VERSION\",\"sourceSha\":\"${{ github.sha }}\"}}"
